name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev valgrind

      - name: Unit tests with ASAN
        run: ./manage.sh test

      # The functional and PTY suites used to run only inside `coverage`, where
      # their exit status was discarded with `|| true` — regressions in them
      # stayed invisible.  Run them here so a failure breaks the build.
      - name: Functional tests
        run: ./manage.sh functional

      - name: PTY tests
        run: ./manage.sh pty
