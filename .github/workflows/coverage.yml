name: Coverage

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev lcov

      - name: Generate coverage report
        run: ./manage.sh coverage

      - name: Generate coverage badges
        run: |
          pip install genbadge[coverage] lcov_cobertura --quiet

          # Combined badge: line coverage of product code (src, libemail, libemail-client)
          lcov_cobertura build/coverage.info -o build/coverage.xml
          genbadge coverage -i build/coverage.xml \
              -o build/coverage_report/coverage-badge.svg

          # External badge: line coverage of the functional + PTY suites
          # together, over the same product code and the same metric.
          lcov_cobertura build/coverage-functional.info \
              -o build/coverage-functional.xml
          genbadge coverage -i build/coverage-functional.xml \
              --name "functional coverage" \
              -o build/coverage_report/coverage-functional-badge.svg

          cp build/coverage_report/coverage-functional-badge.svg \
             build/coverage_functional_report/coverage-badge.svg
          mv build/coverage_functional_report build/coverage_report/functional

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/coverage_report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
