name: Coverage

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev libssl-dev lcov

      - name: Generate coverage report
        run: ./manage.sh coverage

      - name: Generate coverage badges
        run: |
          pip install genbadge[coverage] lcov_cobertura --quiet

          # Combined badge: line coverage
          lcov_cobertura build/coverage.info -o build/coverage.xml
          genbadge coverage -i build/coverage.xml \
              -o build/coverage_report/coverage-badge.svg

          # Functional badge: FUNCTION coverage (not line coverage)
          # genbadge reads Cobertura line-rate, so we build a synthetic XML
          # that exposes function hit/total as the line-rate metric.
          FUNC_SUMMARY=$(lcov --summary build/coverage-functional.info 2>&1 | grep 'functions')
          FUNC_HIT=$(echo "$FUNC_SUMMARY" | grep -oP '(?<=\()\d+')
          FUNC_TOTAL=$(echo "$FUNC_SUMMARY" | grep -oP '\d+(?= functions)')
          python3 - "$FUNC_HIT" "$FUNC_TOTAL" <<'PYEOF'
          import sys, pathlib
          hit, total = sys.argv[1], sys.argv[2]
          # genbadge float()s every standard Cobertura root attribute (a missing
          # `complexity` raises TypeError) and re-derives the rates from the
          # covered/valid counts, rejecting any mismatch.  So: emit the full
          # attribute set, derive line-rate from hit/total rather than from
          # lcov's rounded percentage, and keep branch-rate at 0 to match the
          # zero branch counts — this badge reports function coverage only.
          rate = (float(hit) / float(total)) if float(total) else 0.0
          xml = (
              '<?xml version="1.0" ?>\n'
              f'<coverage line-rate="{rate:.4f}" branch-rate="0"'
              f' lines-covered="{hit}" lines-valid="{total}"'
              ' branches-covered="0" branches-valid="0" complexity="0"'
              ' version="" timestamp="0"><packages/></coverage>\n'
          )
          pathlib.Path('build/coverage-functional-func.xml').write_text(xml)
          PYEOF
          genbadge coverage -i build/coverage-functional-func.xml \
              --name "functional coverage" \
              -o build/coverage_report/coverage-functional-badge.svg

          cp build/coverage_report/coverage-functional-badge.svg \
             build/coverage_functional_report/coverage-badge.svg
          mv build/coverage_functional_report build/coverage_report/functional

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/coverage_report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
