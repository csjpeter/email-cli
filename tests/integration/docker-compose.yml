# No container_name and no fixed volume name: the compose project name
# (COMPOSE_PROJECT_NAME=email-cli-<agent>, set by run_integration.sh) prefixes
# the container and the volume, so two agents never share either (EMAIL-172).
services:
  imap-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Loopback only, and a host port the kernel picks: a fixed 143/993 is
      # taken by any IMAP server the machine already runs.  The scripts read
      # the port back with `docker port`.
      - "127.0.0.1::143"
      - "127.0.0.1::993"
    volumes:
      - maildata:/home/testuser/Maildir
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "993"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  maildata:
